<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="github-video-service.js"></script>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div id="container">
        <div id="countdown">3</div>
        <div id="message" class="hidden">
            <h1 class="glow">MAAK n BIER!</h1>
            <div class="animation-container">
                <p>😎🍻🥃</p>
            </div>
            <div class="media-container">
                <!-- Add your video here -->
                <video id="birthday-video" class="media-item hidden clickable" controls autoplay loop muted playsinline webkit-playsinline title="Double-click to change video">
                    <source src="birthday.mp4" type="video/mp4">
                    <source src="birthday.webm" type="video/webm">
                    <source src="birthday.ogg" type="video/ogg">
                    Your browser does not support the video tag.
                </video>
                <!-- Add your GIF here -->
                <img id="birthday-gif" class="media-item hidden clickable" src="birthday.gif" alt="Birthday Animation" title="Double-click to change GIF">
                <!-- Hidden file inputs -->
                <input type="file" id="video-file-input" accept="video/*" style="display: none;">
                <input type="file" id="gif-file-input" accept="image/gif" style="display: none;">
                <!-- Message when no video -->
                <div id="no-video-message" class="no-video-message hidden">
                    <p>📹 No video yet</p>
                    <p class="small-text">Double-click here to upload a video</p>
                </div>
            </div>
           <p class="sub-text"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
